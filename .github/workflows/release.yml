name: Publish Minecraft 26.3 release

on:
  push:
    tags: ['mc26.3*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test the tagged plugin
        run: mvn -B -ntp clean verify
      - name: Calculate the plugin checksum
        working-directory: target
        run: sha256sum wrn-api-1.0.jar > SHA256SUMS
      - name: Publish the tested plugin and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" --verify-tag --latest
          --title "WRN-API – Minecraft 26.3"
          --notes-file .github/release-notes-mc26.3.md
          target/wrn-api-1.0.jar target/SHA256SUMS
